name: Publish plugin site

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "plugins/pm-os-setup/assets/logo-v2-marketplace.jpg"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site artifact
        shell: bash
        run: |
          mkdir -p _site/assets
          cp -R docs/. _site/
          cp plugins/pm-os-setup/assets/logo-v2-marketplace.jpg _site/assets/pm-os-setup.jpg

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
